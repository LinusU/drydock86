[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/LinusU/drydock86"

[workspace.dependencies]
# Pinned exactly: guest-visible CPU semantics and translated-code behaviour depend on it.
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_x86"] }
wgpu = { version = "=29.0.4" }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
rustc-hash = "2"
sha2 = "0.10"
hex = "0.4"
drydock-core = { path = "crates/drydock-core" }
drydock-win32 = { path = "crates/drydock-win32" }
drydock-gfx = { path = "crates/drydock-gfx" }
drydock-audio = { path = "crates/drydock-audio" }
drydock-fixtures = { path = "crates/drydock-fixtures" }
drydock-media = { path = "crates/drydock-media" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1

# Unicorn 2.1.5 with the store fast-path fix in vendor/patches (see vendor/README.md).
[patch.crates-io]
unicorn-engine-sys = { path = "vendor/unicorn-engine-sys" }
