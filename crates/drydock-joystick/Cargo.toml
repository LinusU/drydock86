[package]
name = "drydock-joystick"
description = "Drydock joystick: force-feedback effect model, HID report descriptors, USB PID force feedback and host game controllers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
hidapi = { version = "2.6", optional = true, default-features = false, features = ["linux-native-basic-udev"] }

[features]
default = ["device"]
device = ["dep:hidapi"]
